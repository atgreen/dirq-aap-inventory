# SPDX-License-Identifier: MIT
# DirQ dynamic inventory for Ansible Automation Platform.
#
# server_url and DIRQ_TOKEN are supplied via the AAP "DirQ Credential"
# attached to this inventory source — they don't need to be hardcoded here.

plugin: atgreen.dirq.dirq

# Optional: filter to a subset of the fleet using a DirQ query.
# query: "SELECT os_info.hostname WHERE tag.env = 'prod'"

# Optional: set to false to keep hosts in inventory but use SSH/WinRM
# instead of the DirQ connection plugin for execution.
# auto_connection: true
